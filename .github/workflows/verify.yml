name: verify

# Puerta de calidad automática. Corre las pruebas ESTÁTICAS (npm run verify) en cada PR y en main:
# secretos, typecheck, lint, pruebas unitarias, build y secretos en el bundle.
# NO usa ningún secreto de Supabase: las pruebas contra el proyecto real (verify:live) se corren
# en local, porque necesitarían guardar la service_role en GitHub. Ver docs/pruebas.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Pruebas estáticas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependencias
        working-directory: apps/web
        run: npm ci

      - name: npm run verify
        working-directory: apps/web
        env:
          # Valores de relleno: el build no necesita el proyecto real ni ningún secreto.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run verify
